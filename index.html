<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Seleksi - ASN Teladan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950">

    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-10 border border-white/20 transition-all duration-300">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white font-bold text-2xl shadow-lg shadow-indigo-600/30 mb-4 transform hover:scale-105 transition">
                ASN
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Seleksi ASN Teladan</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masukkan kredensial resmi Anda untuk memulai ujian</p>
        </div>

        <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Nama Lengkap & Gelar</label>
                <input type="text" id="nama" required placeholder="Contoh: Dr. H. Ahmad, M.Si" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">NIP (Nomor Induk Pegawai)</label>
                <input type="text" id="nip" required placeholder="Contoh: 198501012010011001" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Unit Kerja / Instansi</label>
                <input type="text" id="unit_kerja" required placeholder="Contoh: Sekretariat Daerah" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Token Ujian</label>
                <input type="text" id="token" required placeholder="Masukkan token panitia" 
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition uppercase tracking-widest font-mono font-bold text-center">
            </div>

            <button type="submit" id="btnLogin" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 text-sm mt-2">
                Mulai Ujian Sekarang
            </button>
        </form>

        <div id="pesanError" class="mt-4 p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl hidden text-center font-medium animate-shake"></div>

        <div class="mt-8 text-center border-t border-slate-100 pt-5">
            <a href="admin.html" class="text-xs font-medium text-slate-400 hover:text-indigo-600 transition">Akses Panel Administrator &rarr;</a>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZWzYcVquAJrUV8CKd-_Ly9uGvzR-7bX5gkjCinpzvgvUHDgkdxS2_86SxoJ-3lGxT1A/exec";

        async function prosesLogin(e) {
            e.preventDefault();
            
            let nama = document.getElementById("nama").value.trim();
            let nip = document.getElementById("nip").value.trim();
            let unitKerja = document.getElementById("unit_kerja").value.trim();
            let token = document.getElementById("token").value.trim();
            let btn = document.getElementById("btnLogin");
            let errorBox = document.getElementById("pesanError");

            errorBox.classList.add("hidden");
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memverifikasi Sesi...`;
            btn.disabled = true;

            try {
                let response = await fetch(`${API_URL}?action=getSoalAdmin&nip=${encodeURIComponent(nip)}&nama=${encodeURIComponent(nama)}&unit_kerja=${encodeURIComponent(unitKerja)}&token=${encodeURIComponent(token)}`.replace('getSoalAdmin', 'cekLogin'));
                let result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem("nip_asn", nip);
                    sessionStorage.setItem("nama_asn", result.nama);
                    sessionStorage.setItem("unit_asn", result.unit_kerja);

                    window.location.href = "ujian.html";
                } else {
                    errorBox.innerText = result.message;
                    errorBox.classList.remove("hidden");
                    btn.innerText = "Mulai Ujian Sekarang";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorBox.innerText = "Gagal terhubung ke server utama. Periksa koneksi internet Anda.";
                errorBox.classList.remove("hidden");
                btn.innerText = "Mulai Ujian Sekarang";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
