<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ujian - Seleksi ASN Teladan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
        <div class="text-center mb-6">
            <div class="bg-blue-50 text-blue-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 font-bold text-xl">
                ASN
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Seleksi ASN Teladan</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan lengkapi data diri dan token ujian</p>
        </div>

        <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap & Gelar</label>
                <input type="text" id="nama" required placeholder="Contoh: Dr. H. Ahmad, M.Si" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">NIP (Nomor Induk Pegawai)</label>
                <input type="text" id="nip" required placeholder="Contoh: 198501012010011001" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Unit Kerja / Instansi</label>
                <input type="text" id="unit_kerja" required placeholder="Contoh: Sekretariat Daerah" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Token Ujian</label>
                <input type="text" id="token" required placeholder="Masukkan token dari panitia" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 uppercase tracking-wider font-mono transition">
            </div>

            <button type="submit" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-blue-600/20 mt-2">
                Mulai Ujian
            </button>
        </form>

        <div id="pesanError" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl hidden text-center"></div>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <a href="admin.html" class="text-xs text-slate-400 hover:text-slate-600 transition">Masuk ke Panel Admin &rarr;</a>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx2ztmnvHd0VS3YFgyeGJ7GJUzRzUOiR8BgUVtXq1x-LHR5uDSumRwlwe-EcdjKYzybiQ/exec";

        async function prosesLogin(e) {
            e.preventDefault();
            
            let nama = document.getElementById("nama").value.trim();
            let nip = document.getElementById("nip").value.trim();
            let unitKerja = document.getElementById("unit_kerja").value.trim();
            let token = document.getElementById("token").value.trim();
            let btn = document.getElementById("btnLogin");
            let errorBox = document.getElementById("pesanError");

            errorBox.classList.add("hidden");
            btn.innerText = "Memverifikasi...";
            btn.disabled = true;

            try {
                let response = await fetch(`${API_URL}?action=cekLogin&nip=${encodeURIComponent(nip)}&nama=${encodeURIComponent(nama)}&unit_kerja=${encodeURIComponent(unitKerja)}&token=${encodeURIComponent(token)}`);
                let result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem("nip_asn", nip);
                    sessionStorage.setItem("nama_asn", result.nama);
                    sessionStorage.setItem("unit_asn", result.unit_kerja);

                    window.location.href = "ujian.html";
                } else {
                    errorBox.innerText = result.message;
                    errorBox.classList.remove("hidden");
                    btn.innerText = "Mulai Ujian";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorBox.innerText = "Gagal terhubung ke server. Periksa kembali koneksi Anda.";
                errorBox.classList.remove("hidden");
                btn.innerText = "Mulai Ujian";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
