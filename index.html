<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ujian - Seleksi ASN Teladan</title>
    <!-- Menggunakan Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div class="bg-blue-50 text-blue-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4 font-bold text-xl">
                ASN
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Seleksi ASN Teladan</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masukkan NIP dan Token Ujian Anda</p>
        </div>

        <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">NIP (Nomor Induk Pegawai)</label>
                <input type="text" id="nip" required placeholder="Contoh: 198501012010011001" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Token Ujian</label>
                <input type="text" id="token" required placeholder="Masukkan token dari panitia" 
                    class="w-full border border-slate-300 rounded-xl px-4 py-3 text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition uppercase tracking-wider font-mono">
            </div>

            <button type="submit" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md shadow-blue-600/20">
                Mulai Ujian
            </button>
        </form>

        <div id="pesanError" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl hidden text-center"></div>

        <div class="mt-8 text-center border-t border-slate-100 pt-4">
            <a href="admin.html" class="text-xs text-slate-400 hover:text-slate-600 transition">Masuk ke Panel Admin &rarr;</a>
        </div>
    </div>

    <script>
        // Ganti dengan URL Web App Google Apps Script Anda yang sebenarnya
        const API_URL = "https://script.google.com/macros/s/AKfycbx2ztmnvHd0VS3YFgyeGJ7GJUzRzUOiR8BgUVtXq1x-LHR5uDSumRwlwe-EcdjKYzybiQ/exec";

        async function prosesLogin(e) {
            e.preventDefault();
            
            let nip = document.getElementById("nip").value.trim();
            let token = document.getElementById("token").value.trim();
            let btn = document.getElementById("btnLogin");
            let errorBox = document.getElementById("pesanError");

            // Reset pesan error & ubah tombol jadi loading
            errorBox.classList.add("hidden");
            btn.innerText = "Memverifikasi...";
            btn.disabled = true;

            try {
                // Melakukan request GET ke Apps Script untuk validasi login
                let response = await fetch(`${API_URL}?action=cekLogin&nip=${nip}&token=${token}`);
                let result = await response.json();

                if (result.status === "success") {
                    // Simpan data sesi peserta ke sessionStorage agar bisa dipakai di halaman ujian.html
                    sessionStorage.setItem("nip_asn", nip);
                    sessionStorage.setItem("nama_asn", result.nama);

                    // Arahkan ke halaman ujian
                    window.location.href = "ujian.html";
                } else {
                    // Tampilkan pesan error dari backend
                    errorBox.innerText = result.message;
                    errorBox.classList.remove("hidden");
                    btn.innerText = "Mulai Ujian";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorBox.innerText = "Gagal terhubung ke server. Periksa kembali URL API Anda.";
                errorBox.classList.remove("hidden");
                btn.innerText = "Mulai Ujian";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
