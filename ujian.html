    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-sm p-4 md:p-6 mb-4 flex justify-between items-center sticky top-4 z-10 border border-slate-100">
        <div>
            <h1 class="font-bold text-base md:text-lg text-slate-800">Seleksi ASN Teladan</h1>
            <p class="text-xs md:text-sm text-slate-500" id="namaPeserta">Memuat peserta...</p>

        </div>
    </div>

            <p class="text-center text-slate-400 py-12">Memuat soal ujian dari server...</p>
        </div>

        <!-- Tombol Navigasi -->
        <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
            <button id="btnPrev" onclick="ubahSoal(-1)" class="bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-xl text-slate-700 font-medium transition text-sm">Sebelumnya</button>
            <div id="nomorIndikator" class="text-xs font-semibold text-slate-400">Soal 1 dari 100</div>
            <button id="btnNext" onclick="ubahSoal(1)" class="bg-blue-600 hover:bg-blue-700 px-6 py-2.5 rounded-xl text-white font-medium transition text-sm">Selanjutnya</button>
            <button id="btnSubmit" onclick="konfirmasiSubmit()" class="hidden bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-xl text-white font-medium transition text-sm shadow-md shadow-emerald-600/20">Selesai & Kirim Ujian</button>
        </div>
    </div>

    <script>

        let jawabanSiswa = {}; 
        let timeLeft = 90 * 60; // 90 menit dalam detik

        const nipAktif = sessionStorage.getItem("nip_asn");
        const namaAktif = sessionStorage.getItem("nama_asn");

        if (!nipAktif) {
            alert("Sesi anda habis atau belum login. Silakan login terlebih dahulu.");
            window.location.href = "index.html";
        } else {
            document.getElementById("namaPeserta").innerText = `Peserta: ${namaAktif} (${nipAktif})`;
        }

            try {
                let res = await fetch(`${API_URL}?action=getSoal`);
                let json = await res.json();
                if(json.status === "success") {
                    soalData = json.data;
                    if(soalData.length === 0) {
                        document.getElementById("soal-container").innerHTML = `<p class="text-center text-red-500 py-12">Belum ada soal seleksi yang dimasukkan oleh admin.</p>`;
                        return;
                    }
                    tampilkanSoal();
                    mulaiTimer();
                }
            } catch (err) {
                alert("Gagal memuat soal. Periksa koneksi Anda.");
            }
        }
