<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Seleksi ASN Teladan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="bg-white p-6 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Panel Admin: Kelola Bank Soal</h1>
                <p class="text-sm text-slate-500">Manajemen soal pilihan ganda (Target: 100 Soal)</p>
            </div>
            <div class="flex items-center gap-3">
                <div id="counterSoal" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-sm border border-blue-100">
                    Total Soal: 0
                </div>
                <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-medium text-sm transition">
                    &larr; Keluar
                </a>
            </div>
        </header>

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm mb-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Tambah Soal Baru</h2>
            <form id="formSoal" onsubmit="tambahSoal(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Pertanyaan</label>
                    <textarea id="pertanyaan" rows="3" required class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tuliskan teks pertanyaan di sini..."></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilihan A</label>
                        <input type="text" id="opsi_a" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilihan B</label>
                        <input type="text" id="opsi_b" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilihan C</label>
                        <input type="text" id="opsi_c" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilihan D</label>
                        <input type="text" id="opsi_d" required class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kunci Jawaban Benar</label>
                    <select id="kunci" required class="w-full md:w-1/3 border border-slate-300 rounded-xl p-3 outline-none bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="">Pilih Kunci Jawaban</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <button type="submit" id="btnSimpan" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-md shadow-blue-600/20">
                    Simpan Soal
                </button>
            </form>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Daftar Soal di Database</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase tracking-wider">
                            <th class="p-3">No</th>
                            <th class="p-3">Pertanyaan</th>
                            <th class="p-3">Kunci</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelSoal" class="text-sm text-slate-700 divide-y divide-slate-100">
                        <tr><td colspan="4" class="p-4 text-center text-slate-400">Memuat data soal...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx2ztmnvHd0VS3YFgyeGJ7GJUzRzUOiR8BgUVtXq1x-LHR5uDSumRwlwe-EcdjKYzybiQ/exec";

        async function loadDaftarSoal() {
            try {
                let res = await fetch(`${API_URL}?action=getSoalAdmin`);
                let json = await res.json();
                if(json.status === "success") {
                    let soalList = json.data;
                    document.getElementById("counterSoal").innerText = `Total Soal: ${soalList.length}`;
                    
                    let html = "";
                    soalList.forEach((s, idx) => {
                        html += `
                            <tr class="hover:bg-slate-50">
                                <td class="p-3 font-semibold">${idx + 1}</td>
                                <td class="p-3 max-w-md truncate">${s.pertanyaan}</td>
                                <td class="p-3 font-bold text-blue-600 uppercase">${s.kunci}</td>
                                <td class="p-3 text-center">
                                    <button onclick="hapusSoal('${s.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-100 transition">Hapus</button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById("tabelSoal").innerHTML = html || `<tr><td colspan="4" class="p-4 text-center text-slate-400">Belum ada soal tersimpan.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function tambahSoal(e) {
            e.preventDefault();
            let btn = document.getElementById("btnSimpan");
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            let payload = {
                action: "tambahSoal",
                pertanyaan: document.getElementById("pertanyaan").value,
                a: document.getElementById("opsi_a").value,
                b: document.getElementById("opsi_b").value,
                c: document.getElementById("opsi_c").value,
                d: document.getElementById("opsi_d").value,
                kunci: document.getElementById("kunci").value
            };

            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let json = await res.json();
                if(json.status === "success") {
                    alert(json.message);
                    document.getElementById("formSoal").reset();
                    loadDaftarSoal();
                }
            } catch (err) {
                alert("Gagal menyimpan soal.");
            } finally {
                btn.innerText = "Simpan Soal";
                btn.disabled = false;
            }
        }

        async function hapusSoal(id) {
            if(confirm("Apakah Anda yakin ingin menghapus soal ini?")) {
                try {
                    let res = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "hapusSoal", id: id })
                    });
                    let json = await res.json();
                    if(json.status === "success") {
                        loadDaftarSoal();
                    }
                } catch (err) {
                    alert("Gagal menghapus soal.");
                }
            }
        }

        loadDaftarSoal();
    </script>
</body>
</html>
