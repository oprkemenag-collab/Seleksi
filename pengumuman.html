<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman Hasil Seleksi - ASN Teladan</title>
    <link rel="icon" type="image/png" href="logo-kemenag.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Premium: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Transisi Halus */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Latar Belakang Elegan dengan Pattern Titik */
        .bg-pattern {
            background-image: radial-gradient(#10b981 1px, transparent 1px);
            background-size: 32px 32px;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative bg-pattern overflow-x-hidden">

    <!-- Ornamen Latar Belakang (Aksen Hijau di Atas) -->
    <div class="absolute top-0 left-0 w-full h-[35vh] bg-emerald-900 rounded-b-[4rem] shadow-2xl overflow-hidden z-0">
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-emerald-700 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -top-24 -left-24 w-72 h-72 bg-teal-600 rounded-full blur-3xl opacity-40"></div>
    </div>

    <!-- Kontainer Utama -->
    <div class="flex-grow flex items-center justify-center p-4 sm:p-6 z-10 mt-10 sm:mt-16">
        <div class="max-w-md w-full relative">
            
            <!-- ================= AREA PENCARIAN ================= -->
            <div id="areaPencarian" class="bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-8 sm:p-10 border border-white/60 animate-fade-up relative overflow-hidden">
                <!-- Dekorasi Sudut -->
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-50 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="text-center mb-8 relative z-10">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-[1.25rem] bg-white shadow-xl shadow-emerald-900/10 mb-5 border border-emerald-50 transform hover:scale-105 transition-transform duration-300 p-3">
                        <img src="logo-kemenag.png" alt="Logo" class="w-full h-full object-contain">
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Cek Kelulusan</h1>
                    <p class="text-sm text-slate-500 mt-2 font-medium leading-relaxed">Masukkan NIP Anda untuk melihat hasil Seleksi ASN Teladan.</p>
                </div>

                <form id="formCek" onsubmit="cariHasil(event)" class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">Nomor Induk Pegawai (NIP)</label>
                        <input type="text" id="nip" required placeholder="Contoh: 1234567890" 
                            class="w-full bg-slate-50/50 border-2 border-slate-100 rounded-2xl px-5 py-4 text-slate-800 text-center text-lg focus:ring-0 focus:border-emerald-500 focus:bg-white transition-all font-mono font-bold outline-none shadow-inner placeholder:font-sans placeholder:font-normal placeholder:text-sm">
                    </div>
                    <button type="submit" id="btnCari" 
                        class="w-full bg-gradient-to-r from-emerald-700 to-teal-700 hover:from-emerald-800 hover:to-teal-800 active:scale-[0.98] text-white font-bold py-4 rounded-2xl transition-all duration-200 shadow-lg shadow-emerald-700/30 text-sm tracking-wide">
                        Tampilkan Hasil
                    </button>
                </form>
                
                <div id="pesanError" class="mt-5 p-4 bg-red-50 text-red-600 border border-red-100 text-xs rounded-2xl hidden text-center font-semibold z-10 relative"></div>
            </div>

            <!-- ================= AREA HASIL (Awalnya Sembunyi) ================= -->
            <div id="areaHasil" class="hidden bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-8 sm:p-10 border border-white/60 relative overflow-hidden">
                
                <!-- Efek Glow Cahaya di Belakang Skor -->
                <div id="glowEffect" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none"></div>

                <div class="text-center relative z-10">
                    
                    <!-- Lencana LULUS / TIDAK LULUS -->
                    <div id="badgeStatusContainer" class="mb-6">
                        <span id="badgeStatus" class="inline-flex items-center gap-1.5 px-6 py-2.5 rounded-full font-black text-sm uppercase tracking-widest shadow-md border">
                            <!-- Akan diisi otomatis via JS -->
                        </span>
                    </div>

                    <!-- Profil Peserta -->
                    <h2 id="namaPeserta" class="text-2xl font-extrabold text-slate-900 leading-tight tracking-tight">Nama Peserta</h2>
                    <div class="inline-flex items-center gap-2 bg-slate-100 px-4 py-1.5 rounded-full mt-3 mb-8 border border-slate-200">
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <p id="detailPeserta" class="text-xs text-slate-600 font-semibold"></p>
                    </div>

                    <!-- Kotak Skor -->
                    <div class="bg-gradient-to-b from-white to-slate-50/80 p-6 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm mb-8 relative">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Nilai Akhir Ujian</p>
                        
                        <!-- Angka Skor -->
                        <p id="skorAkhir" class="text-7xl sm:text-8xl font-black bg-clip-text text-transparent drop-shadow-sm pb-2"></p>
                        
                        <div class="flex justify-center gap-3 sm:gap-4 mt-6">
                            <div class="bg-white px-4 py-3 rounded-xl border border-slate-100 shadow-sm flex-1">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Benar</p>
                                <p id="jmlBenar" class="text-xl font-black text-emerald-600"></p>
                            </div>
                            <div class="bg-white px-4 py-3 rounded-xl border border-slate-100 shadow-sm flex-1">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Salah</p>
                                <p id="jmlSalah" class="text-xl font-black text-red-500"></p>
                            </div>
                        </div>
                    </div>

                    <button onclick="window.location.reload()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-2xl transition-colors text-sm">
                        ← Kembali Pencarian
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="text-slate-500/80 text-center py-6 text-[11px] font-semibold z-10 relative">
        &copy; 2026 Seleksi ASN Teladan &bull; Kemenag Kab. Pohuwato
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZWzYcVquAJrUV8CKd-_Ly9uGvzR-7bX5gkjCinpzvgvUHDgkdxS2_86SxoJ-3lGxT1A/exec";

        async function cariHasil(e) {
            e.preventDefault();
            
            let nip = document.getElementById("nip").value.trim();
            let btn = document.getElementById("btnCari");
            let errorBox = document.getElementById("pesanError");
            
            errorBox.classList.add("hidden");
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memverifikasi...`;
            btn.disabled = true;

            try {
                let response = await fetch(`${API_URL}?action=cekHasil&nip=${encodeURIComponent(nip)}`);
                let result = await response.json();

                if (result.status === "success") {
                    
                    // Transisi Halaman
                    document.getElementById("areaPencarian").classList.add("hidden");
                    let areaHasil = document.getElementById("areaHasil");
                    areaHasil.classList.remove("hidden");
                    areaHasil.classList.add("animate-fade-up");
                    
                    // Mengisi Data
                    document.getElementById("namaPeserta").innerText = result.nama;
                    document.getElementById("detailPeserta").innerHTML = `<span class="font-mono text-slate-800">${nip}</span> &bull; ${result.unit_kerja}`;
                    
                    let skorEl = document.getElementById("skorAkhir");
                    skorEl.innerText = result.skor;
                    document.getElementById("jmlBenar").innerText = result.benar;
                    document.getElementById("jmlSalah").innerText = result.salah;

                    // Mengatur Warna Elegan Berdasarkan Kelulusan
                    let badge = document.getElementById("badgeStatus");
                    let glow = document.getElementById("glowEffect");

                    if (result.keterangan === "LULUS") {
                        // Tema Hijau Elegan untuk LULUS
                        badge.className = "inline-flex items-center gap-1.5 px-6 py-2.5 rounded-full font-black text-sm uppercase tracking-widest shadow-lg shadow-emerald-500/30 bg-gradient-to-r from-emerald-500 to-teal-500 text-white border border-emerald-400";
                        badge.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg> LULUS SELEKSI`;
                        skorEl.className = "text-7xl sm:text-8xl font-black bg-clip-text text-transparent bg-gradient-to-b from-emerald-500 to-teal-800 drop-shadow-sm pb-2";
                        glow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl opacity-20 bg-emerald-500 pointer-events-none";
                    } else {
                        // Tema Merah/Abu Elegan untuk TIDAK LULUS
                        badge.className = "inline-flex items-center gap-1.5 px-6 py-2.5 rounded-full font-black text-sm uppercase tracking-widest shadow-lg shadow-red-500/20 bg-gradient-to-r from-red-500 to-rose-500 text-white border border-red-400";
                        badge.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg> TIDAK LULUS`;
                        skorEl.className = "text-7xl sm:text-8xl font-black bg-clip-text text-transparent bg-gradient-to-b from-slate-700 to-slate-900 drop-shadow-sm pb-2";
                        glow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl opacity-10 bg-red-500 pointer-events-none";
                    }
                } else {
                    errorBox.innerText = result.message;
                    errorBox.classList.remove("hidden");
                    btn.innerText = "Tampilkan Hasil";
                    btn.disabled = false;
                }
            } catch (err) {
                errorBox.innerText = "Gagal terhubung ke server. Periksa koneksi internet Anda.";
                errorBox.classList.remove("hidden");
                btn.innerText = "Tampilkan Hasil";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
