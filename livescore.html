<!DOCTYPE html>
<html lang="id" class="min-h-screen bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score - Seleksi ASN Teladan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex flex-col min-h-screen">
    
    <!-- Header Live Score -->
    <header class="bg-emerald-800 text-white p-6 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="text-2xl font-bold uppercase tracking-wider">Papan Peringkat Live</h1>
            <p class="text-emerald-200 text-sm font-medium mt-1">Seleksi ASN Teladan - Kementerian Agama Kab. Pohuwato</p>
        </div>
        <div class="text-right flex flex-col items-end">
            <div class="flex items-center gap-2 mb-1">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
                <span class="font-bold text-sm uppercase tracking-widest text-emerald-100">Live Update</span>
            </div>
            <p class="text-xs text-emerald-300">Auto-refresh tiap 10 detik</p>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase tracking-wider font-semibold">
                            <th class="p-4 w-16 text-center">Rank</th>
                            <th class="p-4">Nama Peserta</th>
                            <th class="p-4">NIP</th>
                            <th class="p-4">Unit Kerja</th>
                            <th class="p-4 text-center">Sesi</th>
                            <th class="p-4 text-center">Waktu Submit</th>
                            <th class="p-4 text-right">Skor Akhir</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPeringkat" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="7" class="p-8 text-center text-slate-400">Memuat data dari server...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-4 text-xs">
        &copy; 2026 Sistem Seleksi ASN Teladan Kementerian Agama
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZWzYcVquAJrUV8CKd-_Ly9uGvzR-7bX5gkjCinpzvgvUHDgkdxS2_86SxoJ-3lGxT1A/exec";
        
        async function fetchLiveScore() {
            try {
                let response = await fetch(`${API_URL}?action=getLiveScore`);
                let json = await response.json();
                
                if (json.status === "success") {
                    renderTabel(json.data);
                }
            } catch (error) {
                console.error("Gagal menarik data:", error);
            }
        }

        function renderTabel(data) {
            let tbody = document.getElementById("tabelPeringkat");
            let html = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">Belum ada peserta yang mengumpulkan ujian.</td></tr>`;
                return;
            }

            data.forEach((peserta, index) => {
                let rank = index + 1;
                let isTop3 = rank <= 3;
                
                // Format Waktu Tampil
                let dateObj = new Date(peserta.waktu);
                let timeString = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                html += `
                    <tr class="hover:bg-slate-50 transition-colors ${isTop3 ? 'bg-emerald-50/30' : ''}">
                        <td class="p-4 text-center">
                            ${rank === 1 ? '<span class="inline-flex w-8 h-8 rounded-full bg-yellow-400 text-yellow-900 font-bold items-center justify-center shadow">1</span>' :
                              rank === 2 ? '<span class="inline-flex w-8 h-8 rounded-full bg-slate-300 text-slate-800 font-bold items-center justify-center shadow">2</span>' :
                              rank === 3 ? '<span class="inline-flex w-8 h-8 rounded-full bg-orange-300 text-orange-900 font-bold items-center justify-center shadow">3</span>' :
                              `<span class="font-semibold text-slate-500">${rank}</span>`}
                        </td>
                        <td class="p-4 font-semibold text-slate-800">${peserta.nama}</td>
                        <td class="p-4 text-slate-500 font-mono text-xs">${peserta.nip}</td>
                        <td class="p-4 text-slate-600">${peserta.unit}</td>
                        <td class="p-4 text-center text-slate-600"><span class="bg-slate-100 px-2 py-1 rounded text-xs border border-slate-200">${peserta.sesi}</span></td>
                        <td class="p-4 text-center text-slate-500">${timeString}</td>
                        <td class="p-4 text-right font-black text-lg ${isTop3 ? 'text-emerald-700' : 'text-slate-700'}">${peserta.skor}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Panggil pertama kali saat halaman dimuat
        fetchLiveScore();

        // Refresh data setiap 10 detik (10000 ms)
        setInterval(fetchLiveScore, 10000);
    </script>
</body>
</html>
